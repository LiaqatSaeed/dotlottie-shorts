<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>raw character preview</title>
  <script type="module">
    import { DotLottie } from "https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-web@0.83.2/+esm";
    window.addEventListener('DOMContentLoaded', () => {
      const dl = new DotLottie({
        canvas: document.getElementById('anim'),
        src: '../external-refs/character-speaking.lottie',
        loop: true,
        autoplay: true,
      });
      window.__dl = dl;
    });
  </script>
  <style>
    body { background: #222; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    #anim { width: 500px; height: 500px; background: #fff; }
  </style>
</head>
<body>
  <canvas id="anim" width="1080" height="1080"></canvas>
</body>
</html>
